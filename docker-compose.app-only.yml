version: '3.8'

services:
  app:
    build: .
    image: diario-de-classe-backend:prod
    environment:
      - NODE_ENV=production
      - JWT_SECRET_TOKEN=${JWT_SECRET_TOKEN:?Defina JWT_SECRET_TOKEN (veja o .env.example)}
      - JWT_REFRESH_TOKEN=${JWT_REFRESH_TOKEN:?Defina JWT_REFRESH_TOKEN (veja o .env.example)}
      - CORS_ORIGINS=${CORS_ORIGINS:?Defina CORS_ORIGINS (veja o .env.example)}
      # Configure o DATABASE_URL conforme seu ambiente externo
    ports:
      - '3000:3000'
    restart: unless-stopped
